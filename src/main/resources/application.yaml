spring:
  application:
    name: mundansok
  datasource:
    # 기본은 메모리 H2(PostgreSQL 호환 모드). 운영은 DATABASE_URL 등으로 PostgreSQL을 넣는다
    url: ${DATABASE_URL:jdbc:h2:mem:mundansok;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

mundansok:
  scan:
    # 같은 도메인을 다시 점검하려면 기다려야 하는 시간
    cooldown: 10m
    http-timeout: 5s
    user-agent: "MundansokScanner/0.1 (+https://github.com/codes-gy/mundansok)"
    # 서버 시작 시 이보다 오래된 QUEUED · RUNNING 점검은 재시작으로 중단된 것으로 보고 FAILED로 정리한다.
    # 정상 점검은 요청마다 5초 제한이라 몇 분 안에 끝난다. 여러 대로 띄울 때 다른 서버가 돌리는 점검을 건드리지 않게 넉넉히 둔다
    stale-after: 15m

# 운영 지표: health와 prometheus만 연다
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
